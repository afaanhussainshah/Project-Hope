<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>31 for 4. Then Kohli Did the Impossible. (MCG 2022)</title>
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('assets/fonts/Anton-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040812;
      font-family: 'Anton', Impact, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040812;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    .paper-cut {
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.72));
    }

    .heavy-shadow {
      filter: drop-shadow(0 22px 38px rgba(0, 0, 0, 0.88));
    }

    .gold-glow {
      filter: drop-shadow(0 0 32px rgba(245, 184, 46, 0.75)) drop-shadow(0 14px 20px rgba(0, 0, 0, 0.8));
    }

    .red-glow {
      filter: drop-shadow(0 0 30px rgba(229, 34, 34, 0.75));
    }
  </style>
  <script src="assets/gsap.min.js"></script>
</head>
<body>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <!-- Radial Vignette: r=75% so all banners from y=250 to y=1650 stay 100% bright -->
        <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="75%">
          <stop offset="60%" stop-color="#000" stop-opacity="0" />
          <stop offset="88%" stop-color="#03060f" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#010307" stop-opacity="0.75" />
        </radialGradient>

        <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#03060E" />
          <stop offset="35%" stop-color="#08142C" />
          <stop offset="75%" stop-color="#0A1836" />
          <stop offset="100%" stop-color="#040915" />
        </linearGradient>

        <linearGradient id="floodBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.85" />
          <stop offset="30%" stop-color="#F5B82E" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#0a142c" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="goldTextGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="38%" stop-color="#FFF3C4" />
          <stop offset="75%" stop-color="#F6B92E" />
          <stop offset="100%" stop-color="#DF8A10" />
        </linearGradient>

        <linearGradient id="indJersey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1B60EC" />
          <stop offset="100%" stop-color="#0B3798" />
        </linearGradient>

        <linearGradient id="pakJersey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#15824A" />
          <stop offset="100%" stop-color="#084224" />
        </linearGradient>
      </defs>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- GLOBAL BACKGROUND (Melbourne MCG Arena)                          -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="bg_layer">
        <rect width="1080" height="1920" fill="url(#skyNight)" />

        <!-- Massive MCG Floodlight Towers -->
        <g id="floodlight_beams" opacity="0.55">
          <polygon points="140,40 -140,1180 440,1280" fill="url(#floodBeam)" />
          <polygon points="940,40 640,1280 1220,1180" fill="url(#floodBeam)" />
          <circle cx="140" cy="40" r="54" fill="#FFF9E6" filter="drop-shadow(0 0 45px #F5B82E)" />
          <circle cx="940" cy="40" r="54" fill="#FFF9E6" filter="drop-shadow(0 0 45px #F5B82E)" />
        </g>

        <!-- MCG Stands & 90,000 Crowd Layers -->
        <g id="mcg_stands">
          <path d="M-40 1080 Q540 920 1120 1080 L1120 1560 L-40 1560 Z" fill="#0A1428" />
          <path d="M-40 1180 Q540 1030 1120 1180 L1120 1560 L-40 1560 Z" fill="#070E1C" />
          <g id="crowd_dots"></g>
          <path d="M-40 1280 Q540 1150 1120 1280" stroke="#FAF4E6" stroke-width="6" stroke-opacity="0.25" fill="none" />
        </g>

        <!-- Turf Field & 22-Yard Pitch Strip -->
        <g id="turf">
          <path d="M-40 1330 Q540 1190 1120 1330 L1120 1960 L-40 1960 Z" fill="#144220" />
          <polygon points="460,1230 620,1230 670,1960 410,1960" fill="#755835" />
          <polygon points="475,1230 605,1230 645,1960 435,1960" fill="#8E6E44" />
          <line x1="430" y1="1350" x2="650" y2="1350" stroke="#FAF4E6" stroke-width="8" stroke-linecap="round" />
          <line x1="390" y1="1720" x2="690" y2="1720" stroke="#FAF4E6" stroke-width="12" stroke-linecap="round" />
        </g>
      </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 1: THE HOOK & 31/4 COLLAPSE (0.00s – 5.60s)                -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene1" opacity="1">
        <rect id="s1_dark_curtain" width="1080" height="1920" fill="#040812" opacity="0.80" />

        <!-- Massive Digital Broken Scoreboard: 31 / 4 -->
        <g id="s1_scoreboard" transform="translate(540, 440)" class="heavy-shadow">
          <rect x="-420" y="-190" width="840" height="380" rx="20" fill="#0C1424" stroke="#253858" stroke-width="10" />
          <rect x="-400" y="-170" width="800" height="340" rx="12" fill="#050B14" />
          <path d="M-360 -130 L360 -130" stroke="#E52222" stroke-width="4" stroke-dasharray="14 10" />
          <text x="0" y="-85" font-family="Anton" font-size="44" fill="#E52222" text-anchor="middle" letter-spacing="8">INDIA &bull; T20 WORLD CUP 2022</text>
          
          <text id="s1_score_val" x="-120" y="85" font-family="Anton" font-size="200" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">31</text>
          <text x="0" y="75" font-family="Anton" font-size="170" fill="#E52222" text-anchor="middle">/</text>
          <text id="s1_wickets_val" x="120" y="85" font-family="Anton" font-size="200" fill="#E52222" text-anchor="middle" letter-spacing="4">4</text>
          
          <rect x="-340" y="115" width="680" height="42" rx="8" fill="#1A253A" />
          <text x="0" y="145" font-family="Anton" font-size="30" fill="#FFC72C" text-anchor="middle" letter-spacing="6">OVERS: 6.1 &bull; TOP ORDER OBLITERATED</text>
        </g>

        <!-- Hook Red Torn-Paper Tape: "THE SHOT THAT BROKE A STADIUM" -->
        <g id="s1_hook_banner" transform="translate(540, 820)" class="heavy-shadow">

          </g>
        </g>

        <!-- Kohli Walking In Alone: Proportional Character Model -->
        <g id="s1_kohli_walk" transform="translate(540, 1500) scale(0.76)" class="heavy-shadow">

          <text x="0" y="425" font-family="Anton" font-size="34" fill="#FF7722" text-anchor="middle">18</text>
          <rect x="-48" y="140" width="96" height="90" rx="18" fill="#995F37"/>
          <!-- Head -->
          <g class="head">
            <ellipse cx="-148" cy="15" rx="26" ry="40" fill="#995F37"/>
            <ellipse cx="148" cy="15" rx="26" ry="40" fill="#995F37"/>
            <rect x="-145" y="-160" width="290" height="345" rx="135" fill="#B87C52"/>
            <!-- Beard -->
            <path d="M-145 20 Q-152 195 0 205 Q152 195 145 20 Q120 155 0 158 Q-120 155 -145 20Z" fill="#181818"/>
            <path d="M-60 85 Q0 70 60 85 Q30 115 0 100 Q-30 115 -60 85Z" fill="#181818"/>
            <!-- Cap -->

            <path d="M-178 -94 Q0 -134 178 -94 Q198 -60 0 -70 Q-198 -60 -178 -94Z" fill="#06162D"/>
            <polygon points="0,-195 6,-180 22,-180 10,-170 14,-155 0,-165 -14,-155 -10,-170 -22,-180 -6,-180" fill="#FFC72C"/>
            <!-- Eyes -->
            <circle cx="-62" cy="5" r="36" fill="#fff"/><circle cx="-62" cy="5" r="16" fill="#0A0A0A"/>
            <circle cx="62" cy="5" r="36" fill="#fff"/><circle cx="62" cy="5" r="16" fill="#0A0A0A"/>
            <rect x="-105" y="-58" width="85" height="18" rx="6" fill="#181818" transform="rotate(8 -62 -58)"/>
            <rect x="20" y="-58" width="85" height="18" rx="6" fill="#181818" transform="rotate(-8 62 -58)"/>
            <path d="M-10 25 Q-4 70 24 60" stroke="#995F37" stroke-width="10" fill="none" stroke-linecap="round"/>
            <rect x="-44" y="115" width="88" height="14" rx="6" fill="#6A2218"/>
          </g>
          <!-- Bat Resting on Shoulder -->
          <g transform="translate(180, 220) rotate(-40)">
            <rect x="-24" y="-320" width="48" height="320" rx="10" fill="#FAF4E6" stroke="#C49B60" stroke-width="6"/>
            <polygon points="-24,-320 24,-320 16,-220 -16,-220" fill="#E52222"/>
            <text x="0" y="-250" font-family="Anton" font-size="28" fill="#FFF" text-anchor="middle">MRF</text>
            <rect x="-12" y="0" width="24" height="100" rx="6" fill="#D4A155"/>
          </g>
        </g>
      </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 2: THE MCG CRUCIBLE & THE COLLAPSE (5.6s – 15.8s)          -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene2" opacity="0">
        <!-- Melbourne MCG Tag -->

          <polygon points="-380,-45 380,-45 370,45 -390,45" fill="#FAF4E6" />

        <!-- Target Big Board -->

          <text x="0" y="-35" font-family="Anton" font-size="38" fill="#90CDF4" text-anchor="middle" letter-spacing="6">TARGET TO CHASE</text>

        </g>

        <!-- 4 Wicket Cards Stamped OUT -->
        <g id="s2_wicket_cards" transform="translate(540, 820)">
          <!-- Rohit -->
          <g id="s2_c1" transform="translate(-360, 0)" class="paper-cut">
            <rect x="-85" y="-120" width="170" height="240" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />

            <g id="s2_out1" transform="rotate(-25)"><rect x="-65" y="-18" width="130" height="36" fill="#E52222" rx="4" /><text x="0" y="9" font-family="Anton" font-size="26" fill="#FFF" text-anchor="middle">OUT</text></g>
          </g>
          <!-- Rahul -->
          <g id="s2_c2" transform="translate(-120, 0)" class="paper-cut">
            <rect x="-85" y="-120" width="170" height="240" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
            <text x="0" y="-65" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle">RAHUL</text>
            <text x="0" y="0" font-family="Anton" font-size="62" fill="#0F2B5C" text-anchor="middle">4</text>
            <text x="0" y="45" font-family="Anton" font-size="20" fill="#718096" text-anchor="middle">(8b)</text>
            <g id="s2_out2" transform="rotate(-25)"><rect x="-65" y="-18" width="130" height="36" fill="#E52222" rx="4" /><text x="0" y="9" font-family="Anton" font-size="26" fill="#FFF" text-anchor="middle">OUT</text></g>
          </g>
          <!-- Surya -->
          <g id="s2_c3" transform="translate(120, 0)" class="paper-cut">
            <rect x="-85" y="-120" width="170" height="240" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
            <text x="0" y="-65" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle">SURYA</text>
            <text x="0" y="0" font-family="Anton" font-size="62" fill="#0F2B5C" text-anchor="middle">15</text>

            <g id="s2_out3" transform="rotate(-25)"><rect x="-65" y="-18" width="130" height="36" fill="#E52222" rx="4" /><text x="0" y="9" font-family="Anton" font-size="26" fill="#FFF" text-anchor="middle">OUT</text></g>
          </g>

            <rect x="-85" y="-120" width="170" height="240" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
            <text x="0" y="-65" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle">AXAR</text>
            <text x="0" y="0" font-family="Anton" font-size="62" fill="#0F2B5C" text-anchor="middle">2</text>
            <text x="0" y="45" font-family="Anton" font-size="20" fill="#718096" text-anchor="middle">(3b)</text>
            <g id="s2_out4" transform="rotate(-25)"><rect x="-65" y="-18" width="130" height="36" fill="#E52222" rx="4" /><text x="0" y="9" font-family="Anton" font-size="26" fill="#FFF" text-anchor="middle">OUT</text></g>
          </g>
        </g>

        <!-- Unbearable Pressure Dial Meter -->
        <g id="s2_pressure_gauge" transform="translate(540, 1340)" class="heavy-shadow">
          <circle cx="0" cy="0" r="220" fill="#0A1224" stroke="#FAF4E6" stroke-width="8" />

          <g id="s2_needle" transform="rotate(-60)">
            <polygon points="-8,20 8,20 0,-170" fill="#FFC72C" />
            <circle cx="0" cy="0" r="18" fill="#FAF4E6" />
          </g>
          <path d="M-45 95 L-25 95 L-15 70 L0 120 L15 80 L25 95 L45 95" stroke="#E52222" stroke-width="6" fill="none" stroke-linecap="round" />
        </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 3: THE 113-RUN REBUILD (15.8s – 26.5s)                     -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene3" opacity="0">
        <!-- Rebuild Header Tape -->
        <g id="s3_header" transform="translate(540, 310)" class="heavy-shadow">
          <polygon points="-360,-40 360,-50 350,45 -370,40" fill="#FFC72C" />

        </g>

        <!-- Characters: Hardik (Left) & Kohli (Right) Running on Pitch -->
        <g id="s3_runners" transform="translate(540, 750)">
          <!-- Hardik Pandya (Left) -->
          <g id="s3_hardik" transform="translate(-250, 0) scale(0.68)" class="heavy-shadow">
            <ellipse cx="0" cy="440" rx="180" ry="32" fill="#000" opacity="0.5" />

              <rect x="-105" y="-55" width="85" height="18" rx="6" fill="#181818"/>

              <path d="M-45 110 Q0 150 45 110" stroke="#581616" stroke-width="10" fill="none" stroke-linecap="round"/>
            </g>
            <g transform="translate(180, 220) rotate(35)">

          <!-- Virat Kohli (Right) -->
          <g id="s3_kohli" transform="translate(250, 0) scale(0.68)" class="heavy-shadow">
            <ellipse cx="0" cy="440" rx="180" ry="32" fill="#000" opacity="0.5" />
            <path d="M-250 430 Q-255 240 -110 205 L110 205 Q255 240 250 430Z" fill="url(#indJersey)"/>
            <path d="M-70 205 L0 300 L70 205 L45 188 L-45 188Z" fill="#FF7722"/>
            <text x="0" y="380" font-family="Anton" font-size="52" fill="#fff" text-anchor="middle" letter-spacing="4">KOHLI</text>
            <text x="0" y="425" font-family="Anton" font-size="34" fill="#FF7722" text-anchor="middle">18</text>
            <rect x="-48" y="140" width="96" height="90" rx="18" fill="#995F37"/>
            <g class="head">
              <ellipse cx="-148" cy="15" rx="26" ry="40" fill="#995F37"/><ellipse cx="148" cy="15" rx="26" ry="40" fill="#995F37"/>

          <polygon points="-440,-95 440,-110 430,95 -435,110" fill="#FAF4E6" stroke="#D4A155" stroke-width="8" />

    tl.fromTo('#s4_bowler',
      { scale: 0.3, opacity: 0 },
      { scale: 0.65, opacity: 1, duration: 0.4, ease: 'power2.out' }, 27.10);

    // Kohli Batting Setup
    tl.fromTo('#s4_kohli_shot',
      { y: 1350, opacity: 0 },
      { y: 1140, opacity: 1, duration: 0.45, ease: 'power2.out' }, 27.40);

    // 28.50s: BALL 18.5 - THE STRAIGHT SIX OVER RAUF'S HEAD!
    tl.to('#s4_bat_arm', { rotation: 25, duration: 0.15, ease: 'power4.in' }, 28.45);
    tl.to('#s4_bat_arm', { rotation: -12, duration: 0.35, ease: 'back.out(2.5)' }, 28.60);

    // Ball rocket straight up over bowler's head into crowd
    tl.fromTo('#s4_ball',
      { x: 540, y: 1020, scale: 1 },
      { x: 540, y: -80, scale: 2.2, duration: 0.95, ease: 'power2.out' }, 28.60);

    // SIX! Comic Stamp Slam
    tl.fromTo('#s4_six_stamp',
      { scale: 0, rotation: -35 },
      { scale: 1.25, rotation: 8, duration: 0.35, ease: 'back.out(2.8)' }, 28.75);
    tl.to('#s4_six_stamp', { scale: 1, duration: 0.2 }, 29.10);

    // Bowler in despair
    tl.to('#s4_bowler', { y: '+=30', scale: 0.72, duration: 0.3, ease: 'bounce.out' }, 29.20);

    // 31.35s: BALL 18.6 - FLICK OVER FINE LEG!
    tl.to('#s4_six_stamp', { scale: 0, duration: 0.2 }, 31.20);
    tl.to('#s4_bat_arm', { rotation: 35, duration: 0.18, ease: 'power4.in' }, 31.30);
    tl.to('#s4_bat_arm', { rotation: -50, duration: 0.3, ease: 'back.out(2)' }, 31.48);

    // Ball 2 arc to fine leg
    tl.fromTo('#s4_ball',
      { x: 540, y: 1020, scale: 1 },
      { x: 120, y: -60, scale: 2.0, duration: 0.85, ease: 'power2.out' }, 31.38);

    // Double Six Stamp Slam
    tl.fromTo('#s4_double_six',
      { y: 1750, scale: 0.7, opacity: 0 },
      { y: 1590, scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 32.10);

    // Fade out Scene 4
    tl.to('#scene4', { opacity: 0, scale: 0.95, duration: 0.45, ease: 'power2.in' }, 36.20);

    // ─────────────────────────────────────────────────────────────
    // SCENE 5: DIWALI IMMORTALITY & KING KOHLI (36.40s – 44.83s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene5', { opacity: 1 }, 36.40);

    // Stat Card Slam: 82* OFF 53
    tl.fromTo('#s5_stat_card',
      { scale: 1.5, opacity: 0, rotation: -5 },
      { scale: 1, opacity: 1, rotation: 1.2, duration: 0.45, ease: 'back.out(2.2)' }, 36.65);

    // Kohli Triumphant Fist Pump
    tl.fromTo('#s5_kohli_triumph',
      { y: 1050, opacity: 0 },
      { y: 870, opacity: 1, duration: 0.5, ease: 'back.out(1.8)' }, 37.50);

    tl.to('#s5_fist_pump', { rotation: 15, yoyo: true, repeat: 7, duration: 0.3, ease: 'sine.inOut' }, 38.00);

    // Diwali Fireworks Launch
    tl.fromTo('#s5_diwali_badge',
      { y: 220, opacity: 0 },
      { y: 320, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 39.50);

    tl.fromTo('#fw1', { scale: 0 }, { scale: 1.2, duration: 0.6, ease: 'back.out(2.5)' }, 39.60);
    tl.fromTo('#fw2', { scale: 0 }, { scale: 1.3, duration: 0.6, ease: 'back.out(2.5)' }, 40.10);
    tl.fromTo('#fw3', { scale: 0 }, { scale: 1.4, duration: 0.7, ease: 'back.out(2.5)' }, 40.75);

    // Royal Crown descends onto King Kohli
    tl.fromTo('#s5_crown',
      { y: 280, scale: 0, rotation: -15 },
      { y: 470, scale: 1.15, rotation: 0, duration: 0.65, ease: 'bounce.out' }, 41.25);

    // Final Verdict Banner Slam
    tl.fromTo('#s5_verdict',
      { y: 1750, scale: 0.7, opacity: 0 },
      { y: 1580, scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2.2)' }, 42.45);
  </script>
