<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>31 for 4. Then Kohli Did the Impossible. (MCG 2022)</title>
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('assets/fonts/Anton-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02050E;
      font-family: 'Anton', Impact, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02050E;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: block;
    }

    .paper-cut {
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.75));
    }

    .heavy-shadow {
      filter: drop-shadow(0 22px 38px rgba(0, 0, 0, 0.90));
    }

    .gold-glow {
      filter: drop-shadow(0 0 35px rgba(245, 184, 46, 0.8)) drop-shadow(0 14px 20px rgba(0, 0, 0, 0.85));
    }

    .red-glow {
      filter: drop-shadow(0 0 32px rgba(229, 34, 34, 0.8));
    }
  </style>
  <script src="assets/gsap.min.js"></script>
</head>
<body>
  <div id="stage">
    <svg id="svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="78%">
          <stop offset="62%" stop-color="#000" stop-opacity="0" />
          <stop offset="90%" stop-color="#020409" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#010205" stop-opacity="0.75" />
        </radialGradient>

        <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#02050E" />
          <stop offset="30%" stop-color="#061228" />
          <stop offset="65%" stop-color="#091A3A" />
          <stop offset="100%" stop-color="#030814" />
        </linearGradient>

        <linearGradient id="floodBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.88" />
          <stop offset="25%" stop-color="#F5B82E" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#091834" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="goldTextGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="35%" stop-color="#FFF4C4" />
          <stop offset="70%" stop-color="#F6B92E" />
          <stop offset="100%" stop-color="#DF8A10" />
        </linearGradient>

        <linearGradient id="indJersey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1E65F3" />
          <stop offset="45%" stop-color="#134BCE" />
          <stop offset="100%" stop-color="#0A2C85" />
        </linearGradient>

        <linearGradient id="pakJersey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#148348" />
          <stop offset="45%" stop-color="#0E6436" />
          <stop offset="100%" stop-color="#074020" />
        </linearGradient>

        <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7B5E38" />
          <stop offset="50%" stop-color="#937248" />
          <stop offset="100%" stop-color="#6E512F" />
        </linearGradient>

        <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#175026" />
          <stop offset="60%" stop-color="#103B1C" />
          <stop offset="100%" stop-color="#0A2712" />

      </defs>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- GLOBAL MCG STADIUM ARCHITECTURE & CROWD (Melbourne Arena)        -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="bg_layer">
        <rect width="1080" height="1920" fill="url(#skyNight)" />

        <!-- Massive MCG Stadium Roof Cantilever & Tiers -->
        <g id="mcg_stands">
          <!-- Tier 3: Distant Upper Deck -->
          <path d="M-60 880 Q540 760 1140 880 L1140 1480 L-60 1480 Z" fill="#060F20" />
          <path d="M-60 920 Q540 800 1140 920" stroke="#FAF4E6" stroke-width="4" stroke-opacity="0.15" fill="none" />
          
          <!-- Tier 2: Mid Grandstand -->
          <path d="M-60 1020 Q540 900 1140 1020 L1140 1550 L-60 1550 Z" fill="#09162E" />
          <path d="M-60 1060 Q540 940 1140 1060" stroke="#FFC72C" stroke-width="5" stroke-opacity="0.25" fill="none" />

          <!-- Dynamic 90,000 Crowd Spectator Dots -->
          <g id="crowd_dots"></g>
          <g id="camera_flashes"></g>

          <!-- Tier 1: Front Boundary Wall -->
          <path d="M-60 1200 Q540 1080 1140 1200 L1140 1580 L-60 1580 Z" fill="#050C1B" />
          <path d="M-60 1240 Q540 1120 1140 1240" stroke="#FAF4E6" stroke-width="6" stroke-opacity="0.30" fill="none" />
          
          <!-- Boundary Advertising Cushions -->
          <path d="M-60 1260 Q540 1140 1140 1260" stroke="#0E387A" stroke-width="16" fill="none" />
        </g>

        <!-- Huge MCG Floodlight Towers (4 Banks) -->
        <g id="floodlight_beams" opacity="0.65">
          <!-- Left Floodlight Tower & Beam -->
          <polygon points="120,30 -160,1260 480,1360" fill="url(#floodBeam)" />
          <circle cx="120" cy="30" r="58" fill="#FFFDF2" filter="drop-shadow(0 0 50px #F5B82E)" />
          
          <!-- Right Floodlight Tower & Beam -->
          <polygon points="960,30 600,1360 1240,1260" fill="url(#floodBeam)" />
          <circle cx="960" cy="30" r="58" fill="#FFFDF2" filter="drop-shadow(0 0 50px #F5B82E)" />

          <!-- High Mid Lights -->
          <circle cx="340" cy="80" r="28" fill="#FFFDF2" opacity="0.8" filter="drop-shadow(0 0 30px #F5B82E)" />
          <circle cx="740" cy="80" r="28" fill="#FFFDF2" opacity="0.8" filter="drop-shadow(0 0 30px #F5B82E)" />
        </g>

        <!-- Lush Green Outfield & 22-Yard Pitch Strip -->
        <g id="turf">
          <path d="M-60 1300 Q540 1160 1140 1300 L1140 1960 L-60 1960 Z" fill="url(#grassGrad)" />
          
          <!-- 3D Perspective Clay Pitch Strip -->
          <polygon points="465,1200 615,1200 675,1960 405,1960" fill="url(#pitchGrad)" />
          <polygon points="480,1200 600,1200 645,1960 435,1960" fill="#9C7B50" opacity="0.5" />
          
          <!-- Bowling Crease (Bowler End) -->
          <line x1="435" y1="1310" x2="645" y2="1310" stroke="#FAF4E6" stroke-width="7" stroke-linecap="round" />
          <!-- Stumps at Bowler End -->
          <line x1="532" y1="1295" x2="532" y2="1310" stroke="#E2B16B" stroke-width="4" />
          <line x1="540" y1="1295" x2="540" y2="1310" stroke="#E2B16B" stroke-width="4" />
          <line x1="548" y1="1295" x2="548" y2="1310" stroke="#E2B16B" stroke-width="4" />
          <line x1="528" y1="1295" x2="552" y2="1295" stroke="#E52222" stroke-width="3" />

          <!-- Popping Crease (Batter End) -->
          <line x1="385" y1="1720" x2="695" y2="1720" stroke="#FAF4E6" stroke-width="12" stroke-linecap="round" />
        </g>
      </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 1: THE HOOK & 31/4 COLLAPSE (0.00s – 5.60s)                -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene1" opacity="1">
        <rect id="s1_dark_curtain" width="1080" height="1920" fill="#030712" opacity="0.82" />

        <!-- Digital Broken Scoreboard: 31 / 4 -->
        <g transform="translate(540, 440)">
          <g id="s1_scoreboard" class="heavy-shadow">
            <rect x="-440" y="-195" width="880" height="390" rx="22" fill="#0B1322" stroke="#253858" stroke-width="10" />
            <rect x="-420" y="-175" width="840" height="350" rx="14" fill="#040812" />
            
            <!-- Top Clean Header Pill Badge (No overlapping lines!) -->
            <rect x="-340" y="-155" width="680" height="52" rx="10" fill="#132036" stroke="#E52222" stroke-width="2" />
            <text x="0" y="-118" font-family="Anton" font-size="34" fill="#E52222" text-anchor="middle" letter-spacing="6">INDIA &bull; T20 WORLD CUP 2022</text>
            
            <!-- Massive 3D Digit Score -->
            <text id="s1_score_val" x="-125" y="80" font-family="Anton" font-size="210" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">31</text>
            <text x="0" y="70" font-family="Anton" font-size="185" fill="#E52222" text-anchor="middle">/</text>
            <text id="s1_wickets_val" x="125" y="80" font-family="Anton" font-size="210" fill="#E52222" text-anchor="middle" letter-spacing="4">4</text>
            
            <!-- Bottom Status Tape -->
            <rect x="-360" y="116" width="720" height="46" rx="8" fill="#132036" />
            <text x="0" y="148" font-family="Anton" font-size="28" fill="#FFC72C" text-anchor="middle" letter-spacing="4">OVERS: 6.1 &bull; TOP ORDER OBLITERATED</text>
          </g>
        </g>

        <!-- Hook Red Torn-Paper Tape: "THE SHOT THAT BROKE A STADIUM" -->
        <g transform="translate(540, 830)">
          <g id="s1_hook_banner" class="heavy-shadow">
            <polygon points="-470,-60 470,-74 460,70 -465,80" fill="#FAF4E6" />
            <polygon points="-465,-53 465,-67 455,63 -460,73" fill="#E52222" />
            <text x="0" y="18" font-family="Anton" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">THE SHOT THAT BROKE A STADIUM</text>
          </g>
        </g>

        <!-- Subtitle Prompt Tape: "EXCEPT ONE MAN" -->
        <g transform="translate(540, 980)">
          <g id="s1_except_tape" scale="0" class="heavy-shadow">
            <polygon points="-320,-48 320,-56 315,50 -325,45" fill="#FAF4E6" />
            <text x="0" y="15" font-family="Anton" font-size="50" fill="#040812" text-anchor="middle" letter-spacing="6">EXCEPT ONE MAN.</text>
          </g>
        </g>

        <!-- Heroic Lone Kohli Walking To The Middle -->
        <g transform="translate(540, 1480)">
          <g id="s1_kohli_walk" scale="0.9" class="heavy-shadow">
            <ellipse cx="0" cy="380" rx="200" ry="34" fill="#000" opacity="0.65" />
            
            <!-- Torso: Team India Jersey #18 -->
            <path d="M-220 380 Q-230 180 -100 155 L100 155 Q230 180 220 380Z" fill="url(#indJersey)"/>
            <path d="M-60 155 L0 240 L60 155 L38 140 L-38 140Z" fill="#FF7722"/>
            <text x="0" y="310" font-family="Anton" font-size="54" fill="#fff" text-anchor="middle" letter-spacing="4">INDIA</text>
            <text x="0" y="355" font-family="Anton" font-size="34" fill="#FFC72C" text-anchor="middle">18</text>
            <rect x="-42" y="100" width="84" height="75" rx="16" fill="#995F37"/>

            <!-- High-End Paper-Cut Kohli Head -->
            <g class="head">
              <ellipse cx="-130" cy="-5" rx="22" ry="36" fill="#995F37"/>
              <ellipse cx="130" cy="-5" rx="22" ry="36" fill="#995F37"/>
              <rect x="-125" y="-155" width="250" height="295" rx="115" fill="#BA7C52"/>
              
              <!-- Sharply Groomed Beard & Sideburns -->
              <path d="M-125 10 Q-130 165 0 172 Q130 165 125 10 Q105 130 0 134 Q-105 130 -125 10Z" fill="#181818"/>
              <path d="M-50 65 Q0 50 50 65 Q25 90 0 78 Q-25 90 -50 65Z" fill="#181818"/>
              
              <!-- India Cricket Helmet with Metallic Grille -->
              <path d="M-135 -75 Q-140 -230 0 -230 Q140 -230 135 -75Z" fill="#0A2C68"/>
              <path d="M-155 -78 Q0 -115 155 -78 Q170 -48 0 -55 Q-170 -48 -155 -78Z" fill="#06162D"/>
              <!-- Golden BCCI Star Emblem -->
              <polygon points="0,-165 5,-152 18,-152 8,-144 11,-132 0,-140 -11,-132 -8,-144 -18,-152 -5,-152" fill="#FFC72C"/>
              
              <!-- Face Grill Guard -->
              <path d="M-105 -35 L-105 50 Q0 85 105 50 L105 -35" stroke="#FAF4E6" stroke-width="5" fill="none" opacity="0.8" />
              <line x1="-105" y1="10" x2="105" y2="10" stroke="#FAF4E6" stroke-width="4" opacity="0.8" />
              
              <!-- Intense Focused Eyes -->
              <ellipse cx="-52" cy="-12" rx="24" ry="14" fill="#FFFFFF"/>
              <circle cx="-52" cy="-12" r="10" fill="#0A0A0A"/>
              <circle cx="-50" cy="-14" r="3" fill="#FFFFFF"/>
              <ellipse cx="52" cy="-12" rx="24" ry="14" fill="#FFFFFF"/>
              <circle cx="52" cy="-12" r="10" fill="#0A0A0A"/>
              <circle cx="54" cy="-14" r="3" fill="#FFFFFF"/>
              
              <!-- Determined Brow -->
              <rect x="-88" y="-38" width="70" height="14" rx="5" fill="#181818" transform="rotate(8 -52 -38)"/>
              <rect x="18" y="-38" width="70" height="14" rx="5" fill="#181818" transform="rotate(-8 52 -38)"/>
              
              <!-- Sculpted Nose & Mouth -->
              <path d="M-8 8 Q-3 45 18 38" stroke="#995F37" stroke-width="7" fill="none" stroke-linecap="round"/>
              <rect x="-35" y="85" width="70" height="10" rx="4" fill="#581616"/>
            </g>

            <!-- Willow Bat Carried Down At Right Side (Zero Face Obstruction!) -->
            <g transform="translate(180, 240) rotate(18)">
              <rect x="-18" y="0" width="36" height="270" rx="8" fill="#FAF4E6" stroke="#C49B60" stroke-width="5"/>
              <polygon points="-18,190 18,190 14,270 -14,270" fill="#E52222"/>
              <text x="0" y="240" font-family="Anton" font-size="20" fill="#FFF" text-anchor="middle">MRF</text>
              <rect x="-8" y="-70" width="16" height="75" rx="4" fill="#D4A155"/>
              <!-- Batting Glove gripping handle -->
              <ellipse cx="0" cy="-35" rx="22" ry="18" fill="#FAF4E6" stroke="#0A2C85" stroke-width="4"/>
            </g>
          </g>
        </g>
      </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 2: THE MCG CRUCIBLE & THE COLLAPSE (5.6s – 15.8s)          -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene2" opacity="0">
        <!-- Melbourne MCG Tag Banner (Generous width to avoid clipping!) -->
        <g transform="translate(540, 270)">
          <g id="s2_venue_badge" class="paper-cut">
            <polygon points="-460,-46 460,-54 450,46 -465,40" fill="#FAF4E6" />
            <text x="0" y="14" font-family="Anton" font-size="38" fill="#0A142C" text-anchor="middle" letter-spacing="5">MELBOURNE CRICKET GROUND &bull; 90,293</text>
          </g>
        </g>

        <!-- Target Big Board (Spacious padding!) -->
        <g transform="translate(540, 470)">
          <g id="s2_target_board" class="heavy-shadow">
            <rect x="-430" y="-120" width="860" height="240" rx="20" fill="#0B152A" stroke="#FAF4E6" stroke-width="8" />
            <text x="0" y="-45" font-family="Anton" font-size="36" fill="#90CDF4" text-anchor="middle" letter-spacing="6">TARGET TO CHASE</text>
            <text x="0" y="65" font-family="Anton" font-size="122" fill="#FFC72C" text-anchor="middle" letter-spacing="4">160 RUNS</text>
          </g>
        </g>

        <!-- 4 Premium Cricket Wicket Cards Stamped OUT -->
        <g id="s2_wicket_cards" transform="translate(540, 830)">
          <!-- Rohit -->
          <g transform="translate(-360, 0)">
            <g id="s2_c1" class="paper-cut">
              <rect x="-95" y="-125" width="190" height="250" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
              <text x="0" y="-70" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle" letter-spacing="2">ROHIT</text>
              <text x="0" y="2" font-family="Anton" font-size="64" fill="#0F2B5C" text-anchor="middle">4</text>
              <text x="0" y="48" font-family="Anton" font-size="22" fill="#718096" text-anchor="middle">(7b)</text>
              <g id="s2_out1"><g transform="rotate(-22)"><rect x="-70" y="-20" width="140" height="40" fill="#E52222" rx="4" /><text x="0" y="10" font-family="Anton" font-size="28" fill="#FFF" text-anchor="middle">OUT</text></g></g>
            </g>
          </g>
          <!-- Rahul -->
          <g transform="translate(-120, 0)">
            <g id="s2_c2" class="paper-cut">
              <rect x="-95" y="-125" width="190" height="250" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
              <text x="0" y="-70" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle" letter-spacing="2">RAHUL</text>
              <text x="0" y="2" font-family="Anton" font-size="64" fill="#0F2B5C" text-anchor="middle">4</text>
              <text x="0" y="48" font-family="Anton" font-size="22" fill="#718096" text-anchor="middle">(8b)</text>
              <g id="s2_out2"><g transform="rotate(-22)"><rect x="-70" y="-20" width="140" height="40" fill="#E52222" rx="4" /><text x="0" y="10" font-family="Anton" font-size="28" fill="#FFF" text-anchor="middle">OUT</text></g></g>
            </g>
          </g>
          <!-- Surya -->
          <g transform="translate(120, 0)">
            <g id="s2_c3" class="paper-cut">
              <rect x="-95" y="-125" width="190" height="250" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
              <text x="0" y="-70" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle" letter-spacing="2">SURYA</text>
              <text x="0" y="2" font-family="Anton" font-size="64" fill="#0F2B5C" text-anchor="middle">15</text>
              <text x="0" y="48" font-family="Anton" font-size="22" fill="#718096" text-anchor="middle">(10b)</text>
              <g id="s2_out3"><g transform="rotate(-22)"><rect x="-70" y="-20" width="140" height="40" fill="#E52222" rx="4" /><text x="0" y="10" font-family="Anton" font-size="28" fill="#FFF" text-anchor="middle">OUT</text></g></g>
            </g>
          </g>
          <!-- Axar -->
          <g transform="translate(360, 0)">
            <g id="s2_c4" class="paper-cut">
              <rect x="-95" y="-125" width="190" height="250" rx="14" fill="#FAF4E6" stroke="#0F2B5C" stroke-width="4" />
              <text x="0" y="-70" font-family="Anton" font-size="28" fill="#0F2B5C" text-anchor="middle" letter-spacing="2">AXAR</text>
              <text x="0" y="2" font-family="Anton" font-size="64" fill="#0F2B5C" text-anchor="middle">2</text>
              <text x="0" y="48" font-family="Anton" font-size="22" fill="#718096" text-anchor="middle">(3b)</text>
              <g id="s2_out4"><g transform="rotate(-22)"><rect x="-70" y="-20" width="140" height="40" fill="#E52222" rx="4" /><text x="0" y="10" font-family="Anton" font-size="28" fill="#FFF" text-anchor="middle">OUT</text></g></g>
            </g>
          </g>
        </g>

        <!-- Unbearable Pressure Dial Meter (Clear padding, accurate needle) -->
        <g transform="translate(540, 1340)">
          <g id="s2_pressure_gauge" class="heavy-shadow">
            <circle cx="0" cy="0" r="230" fill="#0A1224" stroke="#FAF4E6" stroke-width="8" />
            <!-- Gauge Arc: Blue into Flashing Crimson Danger Zone -->
            <path d="M-170 70 A185 185 0 1 1 170 70" stroke="#1E3A5F" stroke-width="32" fill="none" />
            <path d="M40 -180 A185 185 0 0 1 170 70" stroke="#E52222" stroke-width="34" fill="none" />
            
            <text x="0" y="-65" font-family="Anton" font-size="32" fill="#A0AEC0" text-anchor="middle" letter-spacing="4">PRESSURE LEVEL</text>

            <!-- Dial Needle Centered at (0,0) -->

              <circle cx="0" cy="0" r="8" fill="#E52222" />
            </g>
            <!-- EKG Heartbeat Line -->
            <path d="M-50 95 L-30 95 L-20 65 L0 125 L20 75 L30 95 L50 95" stroke="#E52222" stroke-width="6" fill="none" stroke-linecap="round" />
          </g>
        </g>
      </g>

      <!-- ═════════════════════════════════════════════════════════════════ -->
      <!-- SCENE 3: THE 113-RUN REBUILD (15.8s – 26.5s)                     -->
      <!-- ═════════════════════════════════════════════════════════════════ -->
      <g id="scene3" opacity="0">
        <!-- Rebuild Header Tape (Widen to 920px) -->

          <g id="s3_header" class="heavy-shadow">
            <polygon points="-460,-46 460,-54 450,46 -465,40" fill="#FFC72C" />

          </g>
        </g>

        <!-- Characters: Hardik (Left) & Kohli (Right) Running on Pitch -->
        <g id="s3_runners" transform="translate(540, 750)">
          <!-- Hardik Pandya (Left) -->
          <g transform="translate(-240, 0)">
            <g id="s3_hardik" scale="0.75" class="heavy-shadow">
              <ellipse cx="0" cy="420" rx="180" ry="32" fill="#000" opacity="0.5" />
              <path d="M-220 380 Q-230 200 -100 175 L100 175 Q230 200 220 380Z" fill="url(#indJersey)"/>
              <path d="M-65 175 L0 260 L65 175 L40 160 L-40 160Z" fill="#FF7722"/>
              <text x="0" y="320" font-family="Anton" font-size="52" fill="#fff" text-anchor="middle" letter-spacing="4">PANDYA</text>
              <text x="0" y="365" font-family="Anton" font-size="34" fill="#FFC72C" text-anchor="middle">33</text>
              <rect x="-44" y="110" width="88" height="85" rx="16" fill="#8C532E"/>
              
              <g class="head">

    // Ambient camera flashes throughout the match
    flashCoords.forEach((_, idx) => {
      tl.to(`#cflash_${idx}`, { opacity: 0.9, duration: 0.08, repeat: 7, yoyo: true, repeatDelay: Math.random() * 3 + 1 }, Math.random() * 40);
    });

    // ─────────────────────────────────────────────────────────────
    // SCENE 1: THE DARK ABYSS & HOOK (0.00s – 5.60s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene1', { opacity: 1 }, 0);
    tl.fromTo('#s1_scoreboard', 
      { scale: 1.35, opacity: 0, rotation: -3 }, 
      { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: 'back.out(2)' }, 0.15);

    // Vibration on scoreboard
    tl.to('#s1_scoreboard', { x: '+=6', yoyo: true, repeat: 5, duration: 0.05 }, 0.25);

    // Hook Banner Slam: "THE SHOT THAT BROKE A STADIUM"
    tl.fromTo('#s1_hook_banner',
      { y: 300, scale: 0.6, opacity: 0, rotation: 6 },
      { y: 0, scale: 1, opacity: 1, rotation: -1.5, duration: 0.4, ease: 'back.out(1.8)' }, 2.66);

    // Kohli strides in
    tl.fromTo('#s1_kohli_walk',
      { y: 200, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 3.20);

    tl.fromTo('#s1_except_tape',
      { scale: 0, rotation: -12 },
      { scale: 1, rotation: 1.2, duration: 0.35, ease: 'back.out(2.2)' }, 4.27);

    // Fade out Scene 1
    tl.to('#scene1', { opacity: 0, scale: 0.95, duration: 0.45, ease: 'power2.in' }, 5.40);

    // ─────────────────────────────────────────────────────────────
    // SCENE 2: THE MCG CRUCIBLE & COLLAPSE (5.60s – 15.80s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene2', { opacity: 1 }, 5.60);
    tl.fromTo('#s2_venue_badge',
      { y: -90, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.8)' }, 5.85);

    tl.fromTo('#s2_target_board',
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2)' }, 6.78);

    // Sequential Wicket Cards Out Slams (Centered OUT rubber stamps!)
    tl.fromTo('#s2_c1', { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'power2.out' }, 9.80);
    tl.fromTo('#s2_out1', { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.in' }, 10.05);

    tl.fromTo('#s2_c2', { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'power2.out' }, 10.15);
    tl.fromTo('#s2_out2', { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.in' }, 10.35);

    tl.fromTo('#s2_c3', { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'power2.out' }, 10.45);
    tl.fromTo('#s2_out3', { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.in' }, 10.65);

    tl.fromTo('#s2_c4', { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: 'power2.out' }, 10.75);
    tl.fromTo('#s2_out4', { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: 'power4.in' }, 10.95);

    // Pressure Meter needle spiking violently into deep red zone
    tl.fromTo('#s2_pressure_gauge',
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(1.8)' }, 13.50);

    tl.fromTo('#s2_needle_rot', 
      { attr: { transform: 'rotate(-70)' } }, 
      { attr: { transform: 'rotate(70)' }, duration: 1.1, ease: 'elastic.out(1, 0.4)' }, 13.75);
    
    tl.to('#s2_pressure_gauge', { scale: 1.05, yoyo: true, repeat: 7, duration: 0.12 }, 14.20);

    // Fade out Scene 2
    tl.to('#scene2', { opacity: 0, scale: 0.95, duration: 0.4, ease: 'power2.in' }, 15.60);

    // ─────────────────────────────────────────────────────────────
    // SCENE 3: THE 113-RUN REBUILD (15.80s – 26.50s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene3', { opacity: 1 }, 15.80);
    tl.fromTo('#s3_header',
      { y: -160, opacity: 0, rotation: 5 },
      { y: 0, opacity: 1, rotation: -1.2, duration: 0.4, ease: 'back.out(2)' }, 16.05);

    // Runners enter pitch
    tl.fromTo('#s3_hardik', { x: -200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, 17.50);
    tl.fromTo('#s3_kohli', { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, 17.50);

    // Running between wickets bobbing
    tl.to(['#s3_hardik', '#s3_kohli'], { y: -25, yoyo: true, repeat: 11, duration: 0.25, ease: 'sine.inOut' }, 18.20);

    // Partnership Banner Slam
    tl.fromTo('#s3_partnership_card',
      { scale: 1.4, opacity: 0, rotation: -6 },
      { scale: 1, opacity: 1, rotation: 1.5, duration: 0.45, ease: 'back.out(2.2)' }, 21.25);

    // 19th Over Crisis Box Zoom Slam (Anchored at center of screen!)
    tl.to('#s3_partnership_card', { scale: 0.9, y: -50, duration: 0.3 }, 23.70);
    tl.fromTo('#s3_crisis_box',
      { scale: 0, rotation: -6 },
      { scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(2)' }, 23.85);

    // Ticking heartbeat pulsation
    tl.to('#s3_crisis_box', { scale: 1.04, yoyo: true, repeat: 7, duration: 0.16 }, 24.50);

    // Fade out Scene 3
    tl.to('#scene3', { opacity: 0, scale: 0.94, duration: 0.35, ease: 'power2.in' }, 26.40);

    // ─────────────────────────────────────────────────────────────
    // SCENE 4: THE SHOTS (18.5 & 18.6) (26.50s – 36.40s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene4', { opacity: 1 }, 26.50);
    tl.fromTo('#s4_rauf_badge',
      { y: -90, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 26.70);

    tl.fromTo('#s4_bowler',
      { scale: 0.3, opacity: 0 },
      { scale: 0.68, opacity: 1, duration: 0.4, ease: 'power2.out' }, 27.10);

    // Kohli Batting Setup
    tl.fromTo('#s4_kohli_shot',
      { y: 200, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: 'power2.out' }, 27.40);

    // 28.50s: BALL 18.5 - THE STRAIGHT SIX OVER RAUF'S HEAD!
    tl.to('#s4_bat_arm', { rotation: -10, duration: 0.15, ease: 'power4.in', transformOrigin: '0px 40px' }, 28.45);
    tl.to('#s4_bat_arm', { rotation: 40, duration: 0.35, ease: 'back.out(2.5)', transformOrigin: '0px 40px' }, 28.60);

    // Ball rocket straight up over bowler's head into crowd
    tl.fromTo('#s4_ball',
      { x: 540, y: 1020, scale: 1 },
      { x: 540, y: -80, scale: 2.2, duration: 0.95, ease: 'power2.out' }, 28.60);

    // SIX! Comic Stamp Slam
    tl.fromTo('#s4_six_stamp',
      { scale: 0, rotation: -35 },
      { scale: 1.25, rotation: 8, duration: 0.35, ease: 'back.out(2.8)' }, 28.75);
    tl.to('#s4_six_stamp', { scale: 1, duration: 0.2 }, 29.10);

    // Bowler in despair
    tl.to('#s4_bowler', { y: '+=25', scale: 0.74, duration: 0.3, ease: 'bounce.out' }, 29.20);

    // 31.35s: BALL 18.6 - FLICK OVER FINE LEG!
    tl.to('#s4_six_stamp', { scale: 0, duration: 0.2 }, 31.20);
    tl.to('#s4_bat_arm', { rotation: -20, duration: 0.18, ease: 'power4.in', transformOrigin: '0px 40px' }, 31.30);
    tl.to('#s4_bat_arm', { rotation: -70, duration: 0.3, ease: 'back.out(2)', transformOrigin: '0px 40px' }, 31.48);

    // Ball 2 arc to fine leg
    tl.fromTo('#s4_ball',
      { x: 540, y: 1020, scale: 1 },
      { x: 120, y: -60, scale: 2.0, duration: 0.85, ease: 'power2.out' }, 31.38);

    // Double Six Stamp Slam
    tl.fromTo('#s4_double_six',
      { y: 160, scale: 0.7, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 32.10);

    // Fade out Scene 4
    tl.to('#scene4', { opacity: 0, scale: 0.95, duration: 0.45, ease: 'power2.in' }, 36.20);

    // ─────────────────────────────────────────────────────────────
    // SCENE 5: DIWALI IMMORTALITY & KING KOHLI (36.40s – 44.83s)
    // ─────────────────────────────────────────────────────────────
    tl.set('#scene5', { opacity: 1 }, 36.40);

    // Stat Card Slam: 82* OFF 53
    tl.fromTo('#s5_stat_card',
      { scale: 1.5, opacity: 0, rotation: -5 },
      { scale: 1, opacity: 1, rotation: 1.2, duration: 0.45, ease: 'back.out(2.2)' }, 36.65);

    // Kohli Triumphant Fist Pump
    tl.fromTo('#s5_kohli_triumph',
      { y: 180, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.8)' }, 37.50);

    tl.to('#s5_fist_pump', { rotation: 12, yoyo: true, repeat: 7, duration: 0.3, ease: 'sine.inOut', transformOrigin: '0px 0px' }, 38.00);

    // Diwali Fireworks Launch
    tl.fromTo('#s5_diwali_badge',
      { y: -100, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, 39.50);

    tl.fromTo('#fw1', { scale: 0 }, { scale: 1.2, duration: 0.6, ease: 'back.out(2.5)' }, 39.60);
    tl.fromTo('#fw2', { scale: 0 }, { scale: 1.3, duration: 0.6, ease: 'back.out(2.5)' }, 40.10);
    tl.fromTo('#fw3', { scale: 0 }, { scale: 1.4, duration: 0.7, ease: 'back.out(2.5)' }, 40.75);

    // Royal Crown descends onto King Kohli
    tl.fromTo('#s5_crown',
      { y: -200, scale: 0, rotation: -15 },
      { y: 0, scale: 1.15, rotation: 0, duration: 0.65, ease: 'bounce.out' }, 41.25);

    // Final Verdict Banner Slam
    tl.fromTo('#s5_verdict',
      { y: 180, scale: 0.7, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2.2)' }, 42.45);
  </script>
</body>
</html>
